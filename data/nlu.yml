# ==============================================================================
# Natural Language Understanding (NLU) Training Data
# ==============================================================================
# This file contains the training examples for intent classification and entity 
# extraction. 
# 
# Note on Data Augmentation: 
# To ensure model robustness against linguistic variance, the baseline dataset 
# was synthetically expanded using LLM-assisted paraphrasing, capturing a wide 
# distribution of edge cases and diverse command structures.
# ==============================================================================

